name: Refresh CBK Exchange Rates

on:
  schedule:
    - cron: '27 5 * * 1-5' # 08:27 EAT, weekdays
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: main
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: kenyan-stats/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r kenyan-stats/requirements.txt
      - name: Run importer tests
        run: python -m unittest discover -s kenyan-stats/tests -v
      - name: Fetch verified CBK rates
        run: |
          if python kenyan-stats/scripts/update_cbk.py; then
            echo 'CBK import succeeded.'
          else
            echo '::warning::CBK import failed. Prior data retained.'
          fi
      - name: Commit changed data
        run: |
          if git diff --quiet -- kenyan-stats/site/data/exchange-rates.json && git ls-files --error-unmatch kenyan-stats/site/data/exchange-rates.json >/dev/null 2>&1; then
            echo 'No changes.'
          else
            if [ ! -f kenyan-stats/site/data/exchange-rates.json ]; then
              echo 'No valid CBK dataset to publish.'
              exit 0
            fi
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add kenyan-stats/site/data/exchange-rates.json
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'Update CBK indicative exchange rates'
            git push origin HEAD:main
          fi
