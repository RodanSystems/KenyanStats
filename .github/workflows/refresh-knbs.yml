name: Refresh KNBS Inflation

on:
  schedule:
    - cron: '42 6 * * *' # 09:42 EAT daily; KNBS reports usually publish near month-end
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: kenyan-stats/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r kenyan-stats/requirements.txt
      - name: Test importers
        run: python -m unittest discover -s kenyan-stats/tests -v
      - name: Fetch KNBS inflation
        run: python kenyan-stats/scripts/update_knbs.py
      - name: Commit validated data
        run: |
          if git diff --quiet -- kenyan-stats/site/data/inflation.json; then
            echo 'No new inflation data.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add kenyan-stats/site/data/inflation.json
            git commit -m 'Refresh official KNBS inflation'
            git push origin HEAD:main
          fi
