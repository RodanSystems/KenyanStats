
name: Refresh EPRA Data

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: kenyan-stats/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -r kenyan-stats/requirements.txt

      - name: Test EPRA importer
        run: |
          python -m unittest discover -s kenyan-stats/tests -v

      - name: Update fuel prices
        run: |
          if python kenyan-stats/scripts/update_data.py; then
            echo "EPRA refresh completed."
          else
            echo "::warning::EPRA update unavailable. Keeping old data."
          fi

      - name: Commit verified data
        run: |
          if git diff --quiet -- kenyan-stats/site/data/fuel-prices.json; then
            echo "No changes detected."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add kenyan-stats/site/data/fuel-prices.json
            git commit -m "Update EPRA fuel prices"
            git push origin HEAD:main
          fi
