
name: Refresh EPRA data and deploy

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: kenyan-stats/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install -r kenyan-stats/requirements.txt

      - name: Run importer tests
        run: |
          python -m unittest discover -s kenyan-stats/tests -v

      - name: Refresh EPRA prices
        shell: bash
        run: |
          if python kenyan-stats/scripts/update_data.py; then
            echo "EPRA import succeeded."
          else
            echo "::warning::EPRA update failed. Retaining existing verified data."
          fi

      - name: Commit updated dataset
        shell: bash
        run: |
          if git diff --quiet -- kenyan-stats/site/data/fuel-prices.json; then
            echo "Dataset unchanged."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add kenyan-stats/site/data/fuel-prices.json
            git commit -m "Update verified EPRA fuel prices"
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload website
        uses: actions/upload-pages-artifact@v5
        with:
          path: kenyan-stats/site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
